<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel - Clínica Manhattan</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <strong>🦷 Painel da Clínica</strong>
        <nav>
            <span id="usuario"></span>
            <a href="#" class="btn btn-outline btn-sm" onclick="sair()">Sair</a>
        </nav>
    </header>

    <main class="container">
        <h1>Painel</h1>
        <p class="sub">Resumo da clínica e acesso rápido às ações.</p>

        <div class="stats">
            <div class="stat"><strong id="total-pacientes">0</strong><span>Pacientes</span></div>
            <div class="stat"><strong id="total-consultas">0</strong><span>Consultas agendadas</span></div>
            <div class="stat"><strong id="consultas-hoje">0</strong><span>Consultas hoje</span></div>
        </div>

        <div class="grid-2">
            <section class="painel">
                <h2>🧑‍⚕️ Cadastrar paciente</h2>
                <form onsubmit="addPaciente(event)">
                    <label for="p-nome">Nome</label>
                    <input id="p-nome" placeholder="Nome do paciente" required>
                    <label for="p-tel">Telefone</label>
                    <input id="p-tel" placeholder="(49) 99999-9999" required>
                    <button class="btn btn-block">Salvar paciente</button>
                </form>
            </section>

            <section class="painel">
                <h2>📅 Agendar consulta</h2>
                <form onsubmit="addConsulta(event)">
                    <label for="a-paciente">Paciente</label>
                    <select id="a-paciente" required></select>
                    <label for="a-data">Data e hora</label>
                    <input id="a-data" type="datetime-local" required>
                    <label for="a-dentista">Dentista</label>
                    <input id="a-dentista" placeholder="Nome do dentista" required>
                    <button class="btn btn-block">Agendar</button>
                </form>
            </section>
        </div>

        <section class="painel" style="margin-bottom: 20px;">
            <h2>Consultas</h2>
            <div class="tabela-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Paciente</th>
                            <th>Data/Hora</th>
                            <th>Dentista</th>
                        </tr>
                    </thead>
                    <tbody id="lista-consultas"></tbody>
                </table>
            </div>
        </section>

        <section class="painel">
            <h2>Pacientes</h2>
            <div class="tabela-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Telefone</th>
                        </tr>
                    </thead>
                    <tbody id="lista-pacientes"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/sistema.js"></script>
</body>

</html>
