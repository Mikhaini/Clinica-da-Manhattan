
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nícolas ama Ado 💙</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(ellipse at center, #101d42 0%, #050816 65%, #000 100%);
      font-family: Arial, Helvetica, sans-serif;
      color: white;
    }

    #universo {
      position: fixed;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
    }

    .estrela {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #b9f4ff;
      box-shadow: 0 0 10px #00bfff;
      animation: piscar 2s ease-in-out infinite alternate;
    }

    #mensagem {
      position: absolute;
      z-index: 5;
      top: 50%;
      left: 50%;
      width: min(92%, 1000px);
      transform: translate(-50%, -50%);
      text-align: center;
      padding: 24px;
      border: 1px solid rgba(0, 191, 255, 0.3);
      border-radius: 28px;
      background: rgba(0, 5, 25, 0.65);
      backdrop-filter: blur(5px);
      box-shadow:
        0 0 30px rgba(0, 153, 255, 0.15),
        inset 0 0 25px rgba(0, 100, 255, 0.08);
      pointer-events: none;
    }

    h1 {
      margin: 0;
      color: #24caff;
      font-size: clamp(28px, 5vw, 64px);
      line-height: 1.2;
      font-weight: 900;
      text-shadow:
        0 0 5px #00bfff,
        0 0 12px #008cff,
        0 0 30px #005dff,
        0 0 60px #008cff;
      animation: neon 2s ease-in-out infinite alternate;
    }

    .subtitulo {
      margin-top: 22px;
      color: #b8eaff;
      font-size: clamp(15px, 2vw, 22px);
      letter-spacing: 4px;
      text-shadow: 0 0 12px #009dff;
    }

    .pelucia {
      position: absolute;
      z-index: 2;
      width: var(--tamanho);
      height: auto;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
      filter: drop-shadow(0 0 12px rgba(0, 191, 255, 0.75));
      animation: flutuar var(--duracao) ease-in-out infinite alternate;
      animation-delay: var(--atraso);
      will-change: transform;
    }

    @keyframes flutuar {
      0% {
        transform: translate3d(0, 0, 0) rotate(-15deg);
      }
      25% {
        transform: translate3d(45px, -65px, 0) rotate(12deg);
      }
      50% {
        transform: translate3d(-35px, -110px, 0) rotate(-8deg);
      }
      75% {
        transform: translate3d(60px, 35px, 0) rotate(16deg);
      }
      100% {
        transform: translate3d(-25px, 65px, 0) rotate(-12deg);
      }
    }

    @keyframes neon {
      from {
        opacity: 0.8;
        filter: brightness(0.9);
      }
      to {
        opacity: 1;
        filter: brightness(1.3);
      }
    }

    @keyframes piscar {
      from { opacity: 0.2; transform: scale(0.7); }
      to { opacity: 1; transform: scale(1.5); }
    }

    #assinatura {
      position: absolute;
      z-index: 6;
      bottom: 16px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #6cbfff;
      font-size: 12px;
      letter-spacing: 3px;
      opacity: 0.8;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      #mensagem {
        padding: 20px 12px;
      }

      .subtitulo {
        letter-spacing: 2px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 10s !important;
      }
    }
  </style>
</head>

<body>
  <main id="universo">
    <section id="mensagem">
      <h1>O usuário Nícolas ama muito a cantora ado 💙</h1>
      <div class="subtitulo">ADO WORLD ★ 永遠に</div>
    </section>

    <div id="assinatura">SPECIAL TRANSMISSION FOR NICOLAS</div>
  </main>

  <script>
    const universo = document.getElementById("universo");

    // Envie a imagem da pelúcia para images/pelucia.png no repositório.
    const imagemPelucia = "images/pelucia.png";

    // Cria estrelas no fundo.
    for (let i = 0; i < 100; i++) {
      const estrela = document.createElement("span");
      estrela.className = "estrela";
      estrela.style.left = Math.random() * 100 + "%";
      estrela.style.top = Math.random() * 100 + "%";
      estrela.style.animationDelay = Math.random() * 3 + "s";
      universo.appendChild(estrela);
    }

    // Cria as pelúcias flutuantes.
    for (let i = 0; i < 22; i++) {
      const pelucia = document.createElement("img");

      pelucia.className = "pelucia";
      pelucia.src = imagemPelucia;
      pelucia.alt = "";
      pelucia.draggable = false;

      const tamanho = 55 + Math.random() * 65;

      pelucia.style.setProperty("--tamanho", tamanho + "px");
      pelucia.style.setProperty(
        "--duracao",
        (5 + Math.random() * 8) + "s"
      );
      pelucia.style.setProperty(
        "--atraso",
        (-Math.random() * 10) + "s"
      );

      pelucia.style.left = Math.random() * 92 + "%";
      pelucia.style.top = Math.random() * 88 + "%";

      pelucia.onerror = () => {
        pelucia.style.display = "none";
      };

      universo.appendChild(pelucia);
    }
  </script>
</body>
</html>
